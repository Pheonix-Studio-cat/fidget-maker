# Baut die Seite und stellt sie auf GitHub Pages bereit, damit man den
# Fidget Maker ohne Installation im Browser benutzen kann - auch auf dem iPad.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig; laufende werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Einheitstests laufen mit; eine kaputte Fassung soll gar nicht erst
      # online gehen. (npm run build prueft ausserdem die Typen.)
      - run: npm test
      - run: npm run build

      # enablement schaltet Pages beim ersten Lauf selbst frei, damit man es
      # nicht von Hand in den Repository-Einstellungen suchen muss.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
